# Run with:
#   docker compose --env-file backend/.env up -d
#
# The --env-file flag is required — compose needs it to interpolate
# ${POSTGRES_USER} etc. for service environment overrides below.
# backend/.env is not the default auto-load location so must be passed
# explicitly. Containers only receive their own env_file entries, but compose
# itself reads the --env-file for ${VAR} substitution below.
#
# Images are built and pushed by the CI pipeline (see .github/workflows/).
# On the server run once to authenticate with Docker Hub:
#   echo "$DOCKERHUB_TOKEN" | docker login -u <dockerhub-username> --password-stdin

services:
  postgres:
    image: postgres:16-alpine
    container_name: cards-app-postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  minio:
    image: minio/minio
    container_name: cards-app-minio
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  mc-init:
    image: minio/mc
    container_name: cards-app-mc-init
    env_file:
      - ./backend/.env
    depends_on:
      minio:
        condition: service_healthy
    # One `mc anonymous set download` per storage key prefix the app actually
    # uploads under (see each module's `*_STORAGE_KEY_PREFIX` constant —
    # customers.constants.ts, ecards.constants.ts, organisations.constants.ts,
    # smart-cards.constants.ts, products.constants.ts) — every one of these is
    # rendered on a public page (e-card, smart card, shop, org branding), so
    # all need anonymous read; nothing in this bucket is meant to be private.
    # Adding a new upload feature means adding its prefix here too.
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      mc anonymous set download local/$$MINIO_BUCKET/pfp &&
      mc anonymous set download local/$$MINIO_BUCKET/ecards &&
      mc anonymous set download local/$$MINIO_BUCKET/organisation-logo &&
      mc anonymous set download local/$$MINIO_BUCKET/organisation-ecard-templates &&
      mc anonymous set download local/$$MINIO_BUCKET/smart-cards &&
      mc anonymous set download local/$$MINIO_BUCKET/products
      "
    networks:
      - app-network

  backend:
    image: ${DOCKERHUB_USERNAME}/bizvizcards-backend:${IMAGE_TAG:-latest}
    container_name: cards-app-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    # Lets the backend reach services published on the VPS host itself (e.g.
    # the legacy app's Postgres/MinIO host ports) via LEGACY_DATABASE_URL /
    # the one-off `mc mirror` migration step, without joining any other
    # Compose project's network or aliasing its containers into app-network.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    image: ${DOCKERHUB_USERNAME}/bizvizcards-frontend:${IMAGE_TAG:-latest}
    container_name: cards-app-frontend
    restart: unless-stopped
    networks:
      - app-network

  event-app:
    image: ${DOCKERHUB_USERNAME}/bizvizcards-event-app:${IMAGE_TAG:-latest}
    container_name: cards-app-event
    restart: unless-stopped
    networks:
      - app-network

  # Python OCR service. nginx proxies /scanner/* here (see nginx/default.conf).
  # Config is entirely CARD_READER_* env vars (no secrets) — see
  # card-reader/.env.template. The image ships production-safe defaults, so
  # card-reader/.env is OPTIONAL: create it on the VPS only to override
  # something (e.g. CARD_READER_WORKERS on a bigger host). The `required: false`
  # below needs Docker Compose >= v2.24 (Jan 2024); on an older Compose either
  # `touch card-reader/.env` once or drop the long form for `- ./card-reader/.env`.
  # This file is separate from the `--env-file backend/.env` compose reads for
  # ${DOCKERHUB_USERNAME}/${IMAGE_TAG} interpolation.
  card-reader:
    image: ${DOCKERHUB_USERNAME}/bizvizcards-card-reader:${IMAGE_TAG:-latest}
    container_name: cards-app-card-reader
    restart: unless-stopped
    env_file:
      - path: ./card-reader/.env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    mem_limit: 1500m
    cpus: 2.0
    networks:
      - app-network

  nginx:
    image: nginx:1.27-alpine
    container_name: cards-app-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8091:80"
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
      event-app:
        condition: service_started
      card-reader:
        condition: service_healthy
    networks:
      - app-network

volumes:
  postgres_data:
  minio_data:

networks:
  app-network:
    driver: bridge
