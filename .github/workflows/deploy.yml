name: Deploy

on:
  push:
    branches: [main]

# Only one deploy runs at a time; a newer push cancels the in-flight one.
concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/bizvizcards-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/bizvizcards-frontend
  EVENT_APP_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/bizvizcards-event-app

jobs:
  # ── Build & push Docker images ───────────────────────────────────────────────
  build-backend:
    name: Build & push backend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build & push frontend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-event-app:
    name: Build & push event app image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.EVENT_APP_IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./eventApp
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to production server ──────────────────────────────────────────────
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, build-event-app]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            # Pull latest code (nginx config, compose file, postgres init scripts)
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main

            # Authenticate with Docker Hub to pull images
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
              docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Export vars needed by docker-compose.prod.yml interpolation
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            export IMAGE_TAG=latest

            # Pull new images first (while the old stack is still serving
            # traffic) to keep the down/up downtime window as short as
            # possible.
            docker compose --env-file backend/.env pull

            # Full down + up on every deploy, not a selective recreate.
            # Compose only recreates a container when its *service
            # definition* changes (image, env, volume list, ...) — it has no
            # way to detect that a bind-mounted file's *contents* changed
            # (e.g. nginx/default.conf), so a selective `up -d` can leave a
            # container running against a stale bind mount (a single-file
            # bind mount is tied to the inode present at container start;
            # `git pull` replaces that inode via atomic rename, so the
            # running container keeps seeing the old content until it's
            # actually recreated) — this caused a real production incident
            # where nginx kept serving a stale /media/ proxy config across
            # several deploys despite the file on disk being correct, and
            # `nginx -s reload` couldn't fix it because reload re-reads
            # config from the same stale mount. `down` + `up` recreates
            # every container from scratch every time, so this class of bug
            # can't happen — traded off against a brief full-stack restart
            # (postgres/minio data are on named volumes, not removed by
            # `down` without -v, so nothing is lost).
            docker compose --env-file backend/.env down
            docker compose --env-file backend/.env up -d

            # Remove dangling images to reclaim disk
            docker image prune -f

            echo "Deployment complete — $(date)"
