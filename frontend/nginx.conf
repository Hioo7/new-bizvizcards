# Serves the Vite-built SPA static files inside the frontend container.
# Listens on port 3000 to match the nginx upstream block in the root
# nginx/default.conf (which proxies / → frontend:3000).

server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;

    # The service worker itself (and the tiny script that registers it) must
    # never be cached long-term — unlike Vite's content-hashed bundles below,
    # these filenames never change between deploys, so letting them fall into
    # the long-lived immutable rule silently pins visitors to whatever app
    # version was live when they first loaded the site, since the browser
    # never re-fetches sw.js to notice a new one exists. Exact-match (`=`)
    # locations take priority over the regex location below regardless of
    # file order, so these are always evaluated first.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Same reasoning — the PWA manifest isn't content-hashed either.
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Long-lived cache for hashed assets (Vite appends content hashes)
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA catch-all: any unknown path serves index.html so client-side
    # routing works on hard refresh / direct navigation. Explicit no-cache
    # (not just "no directive at all") so the app shell itself is always
    # revalidated too — same reasoning as sw.js above.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
