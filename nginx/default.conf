# Known link-preview crawler user agents (WhatsApp, Telegram, Facebook,
# Twitter/X, LinkedIn, Slack, Discord, Skype, Pinterest, Reddit) — the
# standard technique for SPA + social-preview support: these bots get a
# lightweight, server-rendered Open Graph page instead of the plain SPA
# shell (which they can't execute JS to render); every other visitor is
# completely unaffected.
map $http_user_agent $is_preview_bot {
    default 0;
    ~*facebookexternalhit 1;
    ~*Facebot 1;
    ~*Twitterbot 1;
    ~*WhatsApp 1;
    ~*TelegramBot 1;
    ~*LinkedInBot 1;
    ~*Slackbot 1;
    ~*Discordbot 1;
    ~*SkypeUriPreview 1;
    ~*Pinterest 1;
    ~*redditbot 1;
}

server {
    listen 80;

    # Docker's embedded DNS — re-resolve upstream hostnames on every
    # request (subject to each record's TTL, capped here at 10s) instead
    # of caching them for the container's entire lifetime. Without this,
    # a static `upstream { server minio:9000; }`-style block only resolves
    # once at nginx startup; if a backing service (minio/backend/frontend/
    # event-app) gets recreated afterward — a redeploy, restart policy,
    # image update — it's handed a new IP by Docker's bridge network and
    # nginx keeps sending traffic to the old, dead address (or worse, an
    # address since reassigned to a *different* container) until nginx
    # itself is restarted. Using a variable in each proxy_pass below (with
    # this resolver present) makes nginx re-resolve instead.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend_upstream backend:3000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        # Anonymous, unsigned reads — see docker-compose.yml's mc-init for
        # the per-prefix public-read policy, and MinioMediaStorageProvider
        # for the bucket-wide policy set on backend startup.
        #
        # proxy_pass below uses a variable ($minio_upstream) so nginx
        # re-resolves minio's DNS on each request instead of caching a
        # stale IP across container recreates (see the `resolver` directive
        # above) — but nginx does NOT do its usual automatic
        # location-prefix stripping when proxy_pass contains a variable, so
        # the /media/ prefix must be stripped explicitly here, or MinIO
        # sees "media" as the bucket name instead of the real bucket and
        # 403s every request. `set` must come before `rewrite ... break` —
        # `break` halts all further rewrite-phase directive processing in
        # this block, so a `set` placed after it would never run, leaving
        # $minio_upstream uninitialized.
        set $minio_upstream minio:9000;
        rewrite ^/media/(.*)$ /$1 break;
        proxy_pass http://$minio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # Smart-card and e-card public pages get a server-rendered Open
        # Graph preview for known link-preview crawlers instead of the
        # plain SPA shell — crawlers don't execute JS, so they'd otherwise
        # never see the card's actual title/image. Internally rewritten
        # (not redirected) so the crawler still sees the original
        # /smartcard/:endpoint or /ecard/:endpoint URL.
        if ($is_preview_bot) {
            rewrite ^/smartcard/([^/?]+)$ /__og-preview/$1 last;
            rewrite ^/ecard/([^/?]+)$ /__og-preview-ecard/$1 last;
        }

        # Only a GET/HEAD navigation can match a redirect (mirrors the
        # legacy app's method gate) — everything else goes straight to the
        # frontend.
        if ($request_method !~ ^(GET|HEAD)$) {
            set $frontend_upstream frontend:3000;
            # No URI part here (unlike other proxy_pass calls below) — nginx
            # forbids that inside an `if` block. A prefix location of "/"
            # with no rewrite already means the full original URI is passed
            # through unchanged either way, so this is behaviorally identical.
            proxy_pass http://$frontend_upstream;
            break;
        }

        set $backend_upstream backend:3000;
        # Ask the backend whether this path is a configured redirect before
        # falling back to the SPA. A match returns a real 307 with a
        # Location header straight through to the client — no frontend code
        # ever loads for a redirected path. A miss (404) or any backend
        # error (5xx) falls through to @frontend, exactly like the legacy
        # app's fail-open behavior.
        proxy_pass http://$backend_upstream/api/public/redirects/resolve?path=$request_uri;
        proxy_intercept_errors on;
        error_page 404 = @frontend;
        error_page 500 502 503 504 = @frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @frontend {
        set $frontend_upstream frontend:3000;
        # No URI part — nginx forbids that inside a named location. Same
        # reasoning as the `if` block above: full original URI passes
        # through unchanged regardless.
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Internal-only target for the crawler rewrite above — never reachable
    # directly from outside (see the `internal` directive).
    location ~ ^/__og-preview/(?<smartcard_endpoint>[^/]+)$ {
        internal;
        set $backend_upstream backend:3000;
        # A regex location's proxy_pass can't carry a URI part either, so the
        # target path is built via rewrite first, then passed through as-is.
        rewrite ^ /api/public/smart-cards/$smartcard_endpoint/preview break;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Internal-only target for the e-card crawler rewrite above — never
    # reachable directly from outside (see the `internal` directive).
    location ~ ^/__og-preview-ecard/(?<ecard_endpoint>[^/]+)$ {
        internal;
        set $backend_upstream backend:3000;
        rewrite ^ /api/public/ecards/$ecard_endpoint/preview break;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Event app subdomain (event.domain.com) ───────────────────────────────────
server {
    listen 80;
    server_name event.*;

    resolver 127.0.0.11 valid=10s;

    # API calls from the event app proxy to the shared backend
    location /api/ {
        set $backend_upstream backend:3000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else serves the event SPA
    location / {
        set $event_app_upstream event-app:3001;
        proxy_pass http://$event_app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
